<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>포트폴리오 | 크릿벤처스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-lang="ko">

<!-- 헤더와 전체화면 메뉴는 js/main.js가 주입 -->

<main class="portfolio-page">
  <header class="team-hero" style="background-image:url('assets/img/change2.jpg'); background-position:center 68%">
    <div class="team-hero-dim"></div>
    <div class="team-head">
      <h2>Portfolio</h2>
      <p>크릿벤처스가 함께하는 <strong id="pfCount">0</strong>개의 포트폴리오 기업입니다.</p>
    </div>
  </header>

  <div class="pf-body">
    <!-- 필터 바 -->
    <div class="pf-filters">
      <div class="pf-search">
        <input type="search" id="pfSearch" placeholder="기업명 검색" autocomplete="off">
      </div>

      <div class="pf-filter-row">
        <div class="pf-btns">
          <button type="button" class="pf-btn on" data-view="all">전체</button>
          <button type="button" class="pf-btn" data-view="highlights">Highlights</button>
        </div>
      </div>

      <div class="pf-filter-row">
        <span class="pf-filter-label">섹터</span>
        <div class="pf-btns">
          <button type="button" class="pf-btn on" data-sector="all">전체</button>
          <button type="button" class="pf-btn" data-sector="game">게임</button>
          <button type="button" class="pf-btn" data-sector="content">콘텐츠·엔터</button>
          <button type="button" class="pf-btn" data-sector="ai">AI·딥테크</button>
          <button type="button" class="pf-btn" data-sector="commerce">커머스·플랫폼</button>
          <button type="button" class="pf-btn" data-sector="healthcare">헬스케어</button>
          <button type="button" class="pf-btn" data-sector="web3">Web3·블록체인</button>
        </div>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="pf-grid" id="pfGrid"></div>
    <p class="pf-empty" id="pfEmpty">검색 결과가 없습니다.</p>
  </div>
</main>

<script src="js/portfolio-data.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
